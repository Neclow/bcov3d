      size: 408298
    - path: data/metadata/filtered.csv
      hash: md5
      md5: 121078712db04961f022db58b17cb25a
      size: 42060
  align:
    cmd: "ginsi --leavegappyregion --thread 16 --maxiterate 1000 data/aa/fa/filtered.fa
      > data/aa/fa/aligned.fa\npixi run famsa3di -t 16 data/3di/fa/filtered.fa data/3di/fa/aligned.fa\n"
    deps:
    - path: data/3di/fa/filtered.fa
      hash: md5
      md5: 6b3c11c8a75dcf7ecca66fd3358c6cc4
      size: 340506
    - path: data/aa/fa/filtered.fa
      hash: md5
      md5: 73e126c8aca7dfc249fd7ce511c8fac2
      size: 408298
    params:
      params.yaml:
        mafft.maxiterate: 1000
        threads: 16
    outs:
    - path: data/3di/fa/aligned.fa
      hash: md5
      md5: 5d5702bf656596bd93e919019366e72d
      size: 560960
    - path: data/aa/fa/aligned.fa
      hash: md5
      md5: a9f57c84b478c261dd4de5fe0448deaa
      size: 580800
  trim:
    cmd: "trimal -in data/aa/fa/aligned.fa -out data/aa/fa/trimmed.fa -gt 0.35 -colnumbering
      > data/aa/fa/trimmed.colnumbering\ntrimal -in data/3di/fa/aligned.fa -out data/3di/fa/trimmed.fa
      -gt 0.35 -colnumbering > data/3di/fa/trimmed.colnumbering\n"
    deps:
    - path: data/3di/fa/aligned.fa
      hash: md5
      md5: 5d5702bf656596bd93e919019366e72d
      size: 560960
    - path: data/aa/fa/aligned.fa
      hash: md5
      md5: a9f57c84b478c261dd4de5fe0448deaa
      size: 580800
    params:
      params.yaml:
        trimal.gt: 0.35
    outs:
    - path: data/3di/fa/trimmed.colnumbering
      hash: md5
      md5: 8a7b091d427ca9a0a25cebdbefb8b4cf
      size: 5893
    - path: data/3di/fa/trimmed.fa
      hash: md5
      md5: ad292c3bc867d80719cb5de0e84b9a74
      size: 355200
    - path: data/aa/fa/trimmed.colnumbering
