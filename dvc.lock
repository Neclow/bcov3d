schema: '2.0'
stages:
  download_data:
    cmd: python -m pipeline.download.download_data data/metadata/aug.csv 
      data/metadata/variants.json data/cif data/metadata/clean.csv 
      data/metadata/names.json --threads 16 --format cif
    deps:
    - path: data/metadata/aug.csv
      hash: md5
      md5: 7131b7cea57d5e012c707d12fa5ebd17
      size: 168133
    - path: data/metadata/variants.json
      hash: md5
      md5: 696f4be5d166cf544e64cf590f99b208
      size: 182
    params:
      params.yaml:
        threads: 16
    outs:
    - path: data/cif
      hash: md5
      md5: 0a131573d7314ac7d0d93edf4e85bd1a.dir
      size: 2151326979
      nfiles: 657
    - path: data/metadata/clean.csv
      hash: md5
      md5: 32a75e8659da758558ee657e8c54d705
      size: 89089
    - path: data/metadata/names.json
      hash: md5
      md5: 3a8b2d39e15a0c89a81946985234fe9b
      size: 24934
  filter_binding_partners:
    cmd: python -m pipeline.preprocessing.filter_metadata 
      data/metadata/clean.csv data/metadata/filtered.csv --spike_only
