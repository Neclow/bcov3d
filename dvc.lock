    - path: data/metadata/clean.csv
      hash: md5
      md5: b5380044c697a5637c522969ff851775
      size: 85148
    outs:
    - path: data/metadata/filtered.csv
      hash: md5
      md5: 8b83ab6adc37e1130ca698142f4a9c5f
      size: 42021
  extract:
    cmd: "python -m pipeline.preprocessing.extract_aa data/cif data/aa/fa/raw.fa data/aa/fa/chains.json
      --threads 16\nbash pipeline/preprocessing/extract_3di.sh data/cif data/foldseek
      data/3di/fa/raw.fa 16\n"
    deps:
    - path: data/cif
      hash: md5
      md5: 0a131573d7314ac7d0d93edf4e85bd1a.dir
      size: 2151326979
      nfiles: 657
    params:
      params.yaml:
        threads: 16
    outs:
    - path: data/3di/fa/raw.fa
      hash: md5
      md5: 0d800072c86c7421412e69eb0a0885a6
      size: 2734651
    - path: data/aa/fa/chains.json
      hash: md5
      md5: b540cb7e09c4900f1025e95f44aabaf2
      size: 9782
    - path: data/aa/fa/raw.fa
      hash: md5
      md5: ae2e2f8b0d6fcfbd7303e5fb455f1bfa
      size: 830756
  clean:
    cmd: python -m pipeline.preprocessing.clean data/3di/fa/raw.fa 
      data/aa/fa/raw.fa data/aa/fa/chains.json data/metadata/clean.csv 
      data/3di/fa/filtered.fa data/aa/fa/filtered.fa data/metadata/filtered.csv 
      --spike_only --exclude_chimeric
    deps:
    - path: data/3di/fa/raw.fa
      hash: md5
      md5: 0d800072c86c7421412e69eb0a0885a6
      size: 2734651
    - path: data/aa/fa/chains.json
      hash: md5
      md5: b540cb7e09c4900f1025e95f44aabaf2
      size: 9782
    - path: data/aa/fa/raw.fa
      hash: md5
      md5: ae2e2f8b0d6fcfbd7303e5fb455f1bfa
      size: 830756
    - path: data/metadata/clean.csv
      hash: md5
      md5: 32a75e8659da758558ee657e8c54d705
      size: 89089
    outs:
    - path: data/3di/fa/filtered.fa
      hash: md5
      md5: 6b3c11c8a75dcf7ecca66fd3358c6cc4
      size: 340506
    - path: data/aa/fa/filtered.fa
      hash: md5
