      data/aa/fa/trimmed.fa data/metadata/filtered.csv data/3di/fa/subset.fa 
      data/aa/fa/subset.fa data/metadata/subset.csv --by Virus,MajorVariant
    deps:
    - path: data/3di/fa/trimmed.fa
      hash: md5
      md5: ad292c3bc867d80719cb5de0e84b9a74
      size: 355200
    - path: data/aa/fa/trimmed.fa
      hash: md5
      md5: bd531572bddbd2a9460d8a9c33b8fd39
      size: 420160
    - path: data/metadata/filtered.csv
      hash: md5
      md5: 121078712db04961f022db58b17cb25a
      size: 42060
    params:
      params.yaml:
        subset.by: Virus,MajorVariant
    outs:
